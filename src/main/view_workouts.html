<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>All Workouts</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header><h1>All Workouts</h1></header>

<main>
    <section class="card">
        <h2 id="userHeader">Workouts</h2>
        <div id="workoutList" class="list"></div>

        <div class="actions">
            <a class="link" href="menu.html">Back to Menu</a>
            <button id="clearAll">Clear All Workouts</button>
        </div>
    </section>
</main>

<footer><a href="index.html">Edit User</a></footer>

<script src="app.js"></script>
<script>
    function renderList() {
      const container = document.getElementById('workoutList');
      container.innerHTML = '';
      const user = loadUser();
      if (!user) {
        container.innerHTML = '<p>No user found. <a href="index.html">Create a user</a>.</p>';
        return;
      }
      document.getElementById('userHeader').textContent = `Workouts for ${user.name} (Age ${user.age})`;

      if (user.workouts.length === 0) {
        container.innerHTML = '<p>No workouts yet. Add some!</p>';
        return;
      }

      const ul = document.createElement('ul');
      user.workouts.forEach((w, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `<strong>${w.type}</strong> — ${w.date}: ${w.summary} <a class="tiny" href="workout_detail.html?i=${idx}">Details</a>`;
        ul.appendChild(li);
      });
      container.appendChild(ul);
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderList();
      document.getElementById('clearAll').addEventListener('click', () => {
        if (confirm('Delete all workouts?')) {
          const user = loadUserOrThrow();
          user.workouts = [];
          saveUser(user);
          renderList();
        }
      });
    });
</script>
</body>
</html>
