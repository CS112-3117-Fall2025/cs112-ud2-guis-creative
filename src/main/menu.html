<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Workout Tracker — Menu</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
    <h1>Workout Tracker</h1>
    <p class="tag">Main Menu</p>
</header>

<main>
    <section class="card">
        <h2>Welcome</h2>
        <p id="welcomeLine">Loading user...</p>
        <div class="grid">
            <a class="bigbtn" href="add_cardio.html">Add Cardio Workout</a>
            <a class="bigbtn" href="add_strength.html">Add Strength Workout</a>
            <a class="bigbtn" href="view_workouts.html">View All Workouts</a>
        </div>
    </section>
</main>

<footer>
    <a href="index.html">Edit User</a> · <a href="about.html">About</a>
</footer>

<script src="app.js"></script>
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = loadUser();
      const welcome = document.getElementById('welcomeLine');
      if (user) {
        welcome.textContent = `${user.name}, Age ${user.age} — ${user.workouts.length} workouts saved`;
      } else {
        welcome.innerHTML = 'No user found. <a href="index.html">Create one</a>.';
      }
    });
</script>
</body>
</html>
